<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charlottesville 10 Miler Training</title>
<style>
* { box-sizing: border-box; }
body { background:#FAF8F4; color:#2C3E2D; font:17px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; max-width:660px; margin:auto; padding:2rem 1.25rem 4rem; }
h1 { font-size:1.75rem; line-height:1.2; letter-spacing:-.02em; margin:0; }
header { display:flex; justify-content:space-between; gap:1rem; margin-bottom:1.5rem; }
p { margin:.4rem 0; }
.meta, .muted { color:#58717A; font-size:.85rem; }
.countdown { font-size:2.25rem; font-weight:800; color:#A3533A; line-height:1.1; text-align:right; }
.countdown-label { font-size:.7rem; text-align:right; color:#58717A; }
.phase-title { font-size:.85rem; margin:0 0 .7rem; }
.phase-track { display:flex; height:8px; position:relative; margin:1rem 0 .5rem; border-radius:4px; }
.phase-segment { height:100%; background:var(--phase-color); }
.phase-segment:first-child { border-radius:4px 0 0 4px; }
.phase-segment:last-of-type { border-radius:0 4px 4px 0; }
.phase-marker { position:absolute; width:2px; height:20px; top:-6px; background:#2C3E2D; transform:translateX(-1px); box-shadow:0 0 0 2px #FAF8F4; }
.phase-legend { display:flex; margin-bottom:1.5rem; }
.phase-legend span { font-size:.65rem; text-align:center; }
.timeline-dates { display:flex; justify-content:space-between; font-size:.72rem; color:#58717A; }
nav { display:flex; gap:.5rem; align-items:center; margin:1.5rem 0 1rem; }
button, select { font:inherit; color:inherit; }
nav button, select { background:transparent; border:1px solid #C2CABB; border-radius:6px; min-height:44px; padding:.4rem .65rem; }
select { flex:1; min-width:0; width:100%; font-size:.85rem; }
button { cursor:pointer; touch-action:manipulation; }
button:disabled { opacity:.35; cursor:default; }
button:focus-visible, select:focus-visible { outline:3px solid #5B7E8C; outline-offset:3px; }
.week-heading { font-size:1.1rem; margin:0; }
.week-summary { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.25rem; margin:.4rem 0; }
.week-notes { font-size:.9rem; margin:.6rem 0 1rem; }
.back { border:0; padding:.4rem 0; min-height:44px; color:#496D7B; background:none; font-size:.85rem; text-decoration:underline; }
.run-card { display:block; width:100%; text-align:left; background:var(--tint); border:1px solid #DCE0D7; border-left:4px solid var(--accent); border-radius:7px; padding:1rem; margin:0 0 .85rem; }
.easy { --accent:#3A6640; --tint:#EFF3EC; }
.quality { --accent:#2F5F6E; --tint:#EDF2F4; }
.long { --accent:#795D42; --tint:#F2EDE7; }
.race { --accent:#A3533A; --tint:#F5E9E3; }
.card-header { display:flex; align-items:center; gap:.65rem; }
.run-name { font-weight:700; color:var(--accent); }
.miles { margin-left:auto; font-weight:600; white-space:nowrap; }
.check { flex-shrink:0; width:25px; height:25px; border:1.5px solid var(--accent); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:16px; }
.detail, .pace { display:block; margin-top:.5rem; font-size:.9rem; }
.pace { font-size:.8rem; color:#58717A; }
.run-card[aria-pressed="true"] { background:#F2F2ED; }
.run-card[aria-pressed="true"] .run-name { text-decoration:line-through; }
.run-card[aria-pressed="true"] .check { background:var(--accent); color:white; }
.completion-hint { font-size:.75rem; color:#58717A; margin:1rem 0; }
footer { margin-top:2rem; border-top:1px solid #C2CABB; padding-top:1rem; }
[hidden] { display:none !important; }
@media(max-width:480px) { .phase-legend { display:none; } body { padding-top:1.5rem; } }
</style>
</head>
<body>
<header><div><h1>Kaitlyn's<br>Training Plan</h1><p class="meta" id="race-meta"></p></div><div><div class="countdown" id="countdown"></div><div class="countdown-label" id="countdown-label"></div></div></header>
<noscript>Enable JavaScript to view the training plan and track completed runs.</noscript>
<main id="app" hidden>
<section aria-label="Training phases"><h2 class="phase-title" id="phase-title"></h2><div class="phase-track" id="phase-track" role="img"></div><div class="phase-legend" id="phase-legend" aria-hidden="true"></div><div class="timeline-dates"><span>Sep 7, 2026</span><span>Mar 27, 2027</span></div></section>
<nav aria-label="Choose training week"><button id="previous" aria-label="Previous week">←</button><select id="week-select" aria-label="Training week"></select><button id="next" aria-label="Next week">→</button></nav>
<section aria-labelledby="week-heading"><h2 class="week-heading" id="week-heading"></h2><div class="week-summary muted"><span id="week-meta"></span><span id="progress" role="status"></span></div><button class="back" id="back" hidden>Back to this week</button><p class="week-notes" id="week-notes"></p><div id="cards"></div></section>
<p class="completion-hint" id="storage-hint">Tap a card to mark it done; tap again to undo. Progress is saved in this browser on this device.</p>
</main>
<footer><p class="muted">A flexible week of running, one run at a time.</p></footer>
<script>
const PLAN = __PLAN_DATA__;
const {config, weeks} = PLAN;
const $ = id => document.getElementById(id);
const DAY = 86400000;
// UTC day numbers represent local calendar dates, avoiding DST and ISO parsing shifts.
const dayNumber = iso => Date.parse(iso + 'T00:00:00Z') / DAY;
const todayNumber = () => { const d=new Date(); return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY; };
const dateLabel = n => new Date(n*DAY).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const start = dayNumber(config.plan_start_date), race = dayNumber(config.race_date);
const key = 'running-kaitlyn:' + config.plan_id + ':completed';
let completed = {}, storageAvailable = true;
try { const saved=JSON.parse(localStorage.getItem(key)||'{}'); if(saved && typeof saved==='object' && !Array.isArray(saved)) completed=saved; } catch (_) { storageAvailable=false; }
let today=todayNumber(), currentIndex=0, selectedIndex=null;
const names={easy:'Easy run',quality:'Quality run',long:'Long run',race:'Race'};
const phaseColors={'Recovery':'#A9BDA2','Base Building':'#739878','Build':'#5B7E8C','Taper':'#BA9B72','Race':'#A3533A'};
const escapeHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function pace(run) {
 if(run.kind==='race') return 'Goal pace: '+config.goal_pace;
 if(run.kind==='long') return 'Long run pace: '+config.long_pace+(/goal pace/i.test(run.detail)?' · Goal-pace portions: '+config.goal_pace:'');
 if(run.kind==='easy' || /easy|strides/i.test(run.detail)) return 'Easy pace: '+config.easy_pace;
 if(/tempo/i.test(run.detail)) return 'Tempo portions: '+config.tempo_pace;
 if(/race-pace/i.test(run.detail)) return 'Race-pace portions: '+config.goal_pace;
 return 'Easy portions: '+config.easy_pace;
}
function showWeek(index) {
 selectedIndex=index;
 const w=weeks[index], first=dayNumber(w.start);
 $('week-select').value=index;
 $('previous').disabled=index===0; $('next').disabled=index===weeks.length-1;
 $('week-heading').textContent=(index===currentIndex && today>=start && today<=race ? 'This week · ' : '')+'Week '+w.week;
 $('week-meta').textContent=dateLabel(first)+'–'+dateLabel(first+6)+' · '+w.phase+' · '+w.total+' miles';
 $('week-notes').textContent=w.notes; $('week-notes').hidden=!w.notes;
 $('back').hidden=index===currentIndex;
 $('cards').innerHTML=w.runs.map(r=>`<button type="button" class="run-card ${r.kind}" data-id="${r.id}" aria-pressed="${completed[r.id]===true}"><span class="card-header"><span class="check" aria-hidden="true">${completed[r.id]===true?'✓':''}</span><span class="run-name">${names[r.kind]}</span><span class="miles">${r.miles} mi</span></span>${r.detail?`<span class="detail">${escapeHtml(r.detail)}</span>`:''}<span class="pace">${escapeHtml(pace(r))}</span></button>`).join('');
 updateProgress();
}
function updateProgress() {
 const runs=weeks[selectedIndex].runs;
 $('progress').textContent=runs.filter(r=>completed[r.id]===true).length+' of '+runs.length+' done';
 if(!storageAvailable) $('storage-hint').textContent='Tap a card to mark it done; tap again to undo. Browser storage is unavailable; progress will last only while this page stays open.';
}
function refreshDate() {
 const prior=currentIndex;
 today=todayNumber(); currentIndex=Math.max(0,Math.min(weeks.length-1,Math.floor((today-start)/7)));
 $('countdown').textContent=today<race ? race-today : today===race ? 'Race day!' : 'Finished';
 $('countdown-label').textContent=today<race?'days to race':'';
 $('phase-title').textContent=today<start?'Plan begins '+dateLabel(start):today>race?'Training complete · Well done!':'Current phase · '+weeks[currentIndex].phase;
 $('phase-track').setAttribute('aria-label','Training phases: '+groups.map(g=>g.phase).join(', ')+'. '+$('phase-title').textContent);
 $('today-marker').style.left=(Math.max(0,Math.min(1,(today-start)/(race-start)))*100)+'%';
 if(selectedIndex===null || (prior!==currentIndex && selectedIndex===prior)) showWeek(currentIndex);
 else showWeek(selectedIndex);
}
const groups=[];
weeks.forEach(w=>{const last=groups[groups.length-1]; if(last && last.phase===w.phase) last.end=Math.min(dayNumber(w.start)+7,race+1); else groups.push({phase:w.phase,start:dayNumber(w.start),end:Math.min(dayNumber(w.start)+7,race+1)});});
$('phase-track').innerHTML=groups.map(g=>`<span class="phase-segment" style="flex:${g.end-g.start};--phase-color:${phaseColors[g.phase]}" title="${g.phase}: ${dateLabel(g.start)}–${dateLabel(g.end-1)}"></span>`).join('')+'<span class="phase-marker" id="today-marker" aria-hidden="true"></span>';
$('phase-legend').innerHTML=groups.map(g=>`<span style="flex:${g.end-g.start}">${g.phase}</span>`).join('');
$('race-meta').textContent=config.race_name+' · '+new Date(race*DAY).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
$('week-select').innerHTML=weeks.map((w,i)=>`<option value="${i}">Week ${w.week} · ${dateLabel(dayNumber(w.start))} · ${w.phase}</option>`).join('');
$('week-select').addEventListener('change',e=>showWeek(Number(e.target.value)));
$('previous').addEventListener('click',()=>showWeek(selectedIndex-1));
$('next').addEventListener('click',()=>showWeek(selectedIndex+1));
$('back').addEventListener('click',()=>showWeek(currentIndex));
$('cards').addEventListener('click',e=>{
 const card=e.target.closest('button[data-id]'); if(!card) return;
 const id=card.dataset.id; completed[id]=completed[id]!==true;
 try { localStorage.setItem(key,JSON.stringify(completed)); storageAvailable=true; } catch(_) { storageAvailable=false; }
 card.setAttribute('aria-pressed',String(completed[id])); card.querySelector('.check').textContent=completed[id]?'✓':'';
 updateProgress();
});
window.addEventListener('pageshow',refreshDate);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) refreshDate();});
setInterval(()=>{if(todayNumber()!==today) refreshDate();},60000);
$('app').hidden=false;
refreshDate();
</script>
</body>
</html>
